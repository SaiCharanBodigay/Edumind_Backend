spring.application.name=edumind-backend
logging.level.org.springframework.security=INFO

# Database configuration. Production deployments should set DB_URL/DB_USERNAME/DB_PASSWORD.
# Local tests and non-production local runs default to an embedded H2 instance to avoid failing
# without a configured MySQL service, while still allowing MySQL to be selected via env vars.
spring.datasource.url=${DB_URL:jdbc:h2:mem:edumind;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# JWT configuration. Must be at least 256 bits for HS256/HS384/HS512.
# Keep this value in a real env var or secret manager in production.
jwt.secret=${JWT_SECRET:EduMind-Production-JWT-Secret-Key-2026-For-Local-Development-Only-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Health and actuator endpoints for hosted deployments
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# CORS configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Uploaded course materials are stored outside the frontend's public directory.
edumind.storage.learning-materials=${EDUMIND_STORAGE_DIR:/data/learning-materials}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:21MB}
edumind.storage.assignment-submissions=${EDUMIND_ASSIGNMENT_STORAGE_DIR:/data/assignment-submissions}
edumind.assignments.max-submission-size-bytes=${EDUMIND_ASSIGNMENT_MAX_SUBMISSION_SIZE_BYTES:10485760}

# Local development bootstrap. For production, set EDUMIND_SEED_ADMIN_ENABLED=false and provide a secret password
# through the hosting platform environment rather than leaving a default credential in source.
edumind.seed-admin.enabled=${EDUMIND_SEED_ADMIN_ENABLED:true}
edumind.seed-admin.username=${EDUMIND_ADMIN_USERNAME:admin}
edumind.seed-admin.password=${EDUMIND_ADMIN_PASSWORD:Admin@123456}
